[package]
name = "xi-md"
version = "0.1.0"
description = "XiMD - Minimalist & Beautiful Markdown Editor for macOS"
authors = ["xicheng"]
edition = "2021"

[lib]
name = "xi_md_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
window-vibrancy = "0.5"
